<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านอาหารอร่อยจัง - เมนูอาหาร</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-amber-500 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> อร่อยจัง Restaurant
            </h1>
            <!-- Cart Button -->
            <button onclick="toggleCartModal()" class="relative bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-full font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>ตะกร้า</span>
                <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-6">
        <!-- Search & Filter Controls -->
        <section class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Search Bar -->
            <div class="relative w-full md:w-1/3">
                <input type="text" id="search-input" oninput="filterMenu()" placeholder="ค้นหาชื่อเมนู..." 
                    class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            </div>

            <!-- Category Buttons -->
            <div class="flex flex-wrap gap-2 justify-center" id="category-buttons">
                <button onclick="selectCategory('all')" class="category-btn active bg-amber-500 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition">ทั้งหมด</button>
                <button onclick="selectCategory('main')" class="category-btn bg-white text-gray-700 hover:bg-amber-100 px-4 py-2 rounded-lg font-medium shadow-sm transition">อาหารจานหลัก</button>
                <button onclick="selectCategory('dessert')" class="category-btn bg-white text-gray-700 hover:bg-amber-100 px-4 py-2 rounded-lg font-medium shadow-sm transition">ของหวาน</button>
                <button onclick="selectCategory('drink')" class="category-btn bg-white text-gray-700 hover:bg-amber-100 px-4 py-2 rounded-lg font-medium shadow-sm transition">เครื่องดื่ม</button>
            </div>
        </section>

        <!-- Menu Grid -->
        <section id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Content generated by JavaScript -->
        </section>
    </main>

    <!-- Cart Modal Side Panel -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-basket-shopping text-amber-500"></i> ตะกร้าของคุณ</h2>
                    <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                </div>
                <div id="cart-items" class="space-y-4">
                    <!-- Cart items rendered here -->
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="border-t pt-4 mt-6">
                <div class="flex justify-between items-center text-lg font-bold mb-4">
                    <span>ราคารวมทั้งหมด:</span>
                    <span id="total-price" class="text-amber-600">0 บาท</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-semibold transition shadow-md">
                    ยืนยันการสั่งซื้อ
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // 1. Data Mockup
        const menuData = [
            { id: 1, name: "ผัดไทยกุ้งสด", category: "main", price: 85, image: "https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=500&q=80", desc: "ผัดไทยเส้นจันทน์เหนียวนุ่ม กุ้งสดตัวโต" },
            { id: 2, name: "ข้าวมันไก่ต้ม", category: "main", price: 60, image: "https://images.unsplash.com/photo-1626804475297-41608ea09aeb?auto=format&fit=crop&w=500&q=80", desc: "ข้าวมันหอมนุ่ม เสิร์ฟพร้อมไก่น้ำจิ้มรสเด็ด" },
            { id: 3, name: "ส้มตำไทยไข่เค็ม", category: "main", price: 65, image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=500&q=80", desc: "ส้มตำรสแซ่บ ครบรส พร้อมไข่เค็มมันๆ" },
            { id: 4, name: "บิงซูชาไทย", category: "dessert", price: 129, image: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=500&q=80", desc: "น้ำแข็งไสเกล็ดหิมะรสชาไทย หวานมันนุ่มลิ้น" },
            { id: 5, name: "ข้าวเหนียวมะม่วง", category: "dessert", price: 90, image: "https://images.unsplash.com/photo-1528825871115-3581a5387919?auto=format&fit=crop&w=500&q=80", desc: "มะม่วงน้ำดอกไม้หวานฉ่ำ พร้อมข้าวเหนียวมูน" },
            { id: 6, name: "ชาไทยเย็น", category: "drink", price: 45, image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80", desc: "ชาไทยเข้มข้น หอมกลิ่นชา ชงสดใหม่ทุกแก้ว" },
            { id: 7, name: "กาแฟอเมริกาโน่เย็น", category: "drink", price: 55, image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=500&q=80", desc: "เมล็ดกาแฟคั่วกลาง หอมเข้ม สดชื่น" }
        ];

        let currentCategory = 'all';
        let cart = [];

        // 2. Render Menu Items
        function renderMenu(items) {
            const menuGrid = document.getElementById('menu-grid');
            menuGrid.innerHTML = '';

            if (items.length === 0) {
                menuGrid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">ไม่พบเมนูที่คุณค้นหา</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <img src="${item.image}" alt="${item.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-gray-800">${item.name}</h3>
                                <span class="bg-amber-100 text-amber-800 font-bold px-2.5 py-0.5 rounded-full text-sm">${item.price} ฿</span>
                            </div>
                            <p class="text-gray-600 text-sm mb-4">${item.desc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="addToCart(${item.id})" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 rounded-xl transition flex justify-center items-center gap-2">
                            <i class="fa-solid fa-plus"></i> เพิ่มลงตะกร้า
                        </button>
                    </div>
                `;
                menuGrid.appendChild(card);
            });
        }

        // 3. Filter Logic
        function filterMenu() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const filtered = menuData.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });
            renderMenu(filtered);
        }

        function selectCategory(cat) {
            currentCategory = cat;
            
            // Update UI Button active state
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-amber-500', 'text-white');

            filterMenu();
        }

        // 4. Cart Logic
        function addToCart(id) {
            const item = menuData.find(m => m.id === id);
            const cartItem = cart.find(c => c.id === id);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }

            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const cartItem = cart.find(c => c.id === id);
            if (cartItem) {
                cartItem.quantity += delta;
                if (cartItem.quantity <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            // Update Count
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;

            // Render Items
            const cartContainer = document.getElementById('cart-items');
            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.innerHTML = `<p class="text-center text-gray-400 py-8">ไม่มีสินค้าในตะกร้า</p>`;
            } else {
                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center border-b pb-3";
                    row.innerHTML = `
                        <div>
                            <h4 class="font-semibold text-gray-800">${item.name}</h4>
                            <p class="text-sm text-gray-500">${item.price} ฿ × ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 rounded-full flex items-center justify-center font-bold text-gray-700">-</button>
                            <span class="font-medium">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center font-bold">+</button>
                        </div>
                    `;
                    cartContainer.appendChild(row);
                });
            }

            // Update Total Price
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('total-price').innerText = `${totalPrice} บาท`;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('โปรดเลือกเมนูอาหารก่อนทำการสั่งซื้อ');
                return;
            }
            alert('สั่งซื้อสำเร็จ! ทางร้านกำลังจัดเตรียมอาหารให้คุณ');
            cart = [];
            updateCartUI();
            toggleCartModal();
        }

        // Initial Load
        renderMenu(menuData);
    </script>
</body>
</html>
